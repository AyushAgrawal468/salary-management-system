spring.application.name=salary-management

# Hosts like Render pass the port in PORT and terminate HTTPS at their proxy;
# trusting X-Forwarded-* keeps generated URLs (e.g. Location headers) on https.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Defaults target the local dev database (backend/scripts/create-local-db.sql).
# Deployed environments must set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salary}
spring.datasource.username=${DB_USERNAME:salary_app}
spring.datasource.password=${DB_PASSWORD:salary_app}

# Schema is owned by Flyway migrations; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie: invisible to JavaScript, HTTPS-only (browsers allow Secure on http://localhost),
# never sent on cross-site requests. Idle sessions expire after 30 minutes.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Stable JSON shape for paged responses: {content, page:{size, number, totalElements, totalPages}}.
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# Only expose health; everything else stays internal.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
